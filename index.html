    <!--
      ==========================================================================
      SECURITY FALLBACK — CSP
      --------------------------------------------------------------------------
      Esta CSP sirve como una barrera adicional para despliegues estáticos.
      En producción, replica y refuerza esta política como HTTP header.
      Una CSP enviada por HTTP se aplica antes de procesar el documento y
      ofrece capacidades que una meta CSP no puede proporcionar.
      ==========================================================================
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        script-src 'self' 'unsafe-inline' https://pixel.idlen.io;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https:;
        media-src 'self' blob: https:;
        connect-src 'self' https://api.isabella.ai https://pixel.idlen.io;
        worker-src 'self' blob:;
        manifest-src 'self';
        frame-src 'self' https:;
        form-action 'self';
        upgrade-insecure-requests;
      "
    />

    <!--
      ==========================================================================
      DOCUMENT BASE
      ==========================================================================
    -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#040507" />

    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      Permissions-Policy:
      La app no solicita cámara, micrófono ni geolocalización desde el documento
      base. Abre esas capacidades únicamente cuando un módulo específico lo
      requiere y tu infraestructura ya tenga la política correspondiente.
    -->
    <meta
      http-equiv="Permissions-Policy"
      content="accelerometer=(), autoplay=(self), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    />

      ==========================================================================

    <!--
      ==========================================================================
      ADVERTISING / CAMPAIGN ANALYTICS
      --------------------------------------------------------------------------
      Principios:
      1. El proveedor se carga únicamente tras consentimiento explícito.
      2. No enviar prompts, respuestas, memorias, documentos, identidad sensible,
         estado emocional, credenciales, ni información financiera.
      3. El backend decide campañas y segmentos permitidos.
      4. El pixel solo mide eventos autorizados: PageView, AdImpression,
         AdClick, AdDismissed y CampaignInfoOpened.
      ==========================================================================
    -->
    <script>
      (function (window, document) {
        "use strict";

        var CONSENT_KEY = "isabella.consent.advertising.v1";
        var PIXEL_SRC = "https://pixel.idlen.io/v1/pixel.js";
        var PIXEL_ID = "%VITE_IDLEN_PIXEL_ID%";

        var ads = {
          initialized: false,
          consent: "unknown",

          readConsent: function () {
            try {
              return window.localStorage.getItem(CONSENT_KEY) || "unknown";
            } catch (_) {
              return "unknown";
            }
          },

          writeConsent: function (value) {
            try {
              window.localStorage.setItem(CONSENT_KEY, value);
            } catch (_) {
              /* Storage may be unavailable; application remains functional. */
            }
          },

          ensureQueue: function () {
            window.idlen =
              window.idlen ||
              function () {
                (window.idlen.q = window.idlen.q || []).push(
                  Array.prototype.slice.call(arguments)
                );
              };
          },

          loadProvider: function () {
            if (this.initialized || PIXEL_ID === "%VITE_IDLEN_PIXEL_ID%") {
              return;
            }

            this.initialized = true;
            this.ensureQueue();

            var script = document.createElement("script");
            script.async = true;
            script.src = PIXEL_SRC;
            script.referrerPolicy = "strict-origin-when-cross-origin";

            script.onload = function () {
              window.idlen("init", PIXEL_ID);
              window.idlen("track", "PageView", {
                product: "isabella-ai",
                surface: "application",
                consent: "advertising"
              });
            };

            script.onerror = function () {
              window.dispatchEvent(
                new CustomEvent("isabella:analytics-error", {
                  detail: { provider: "idlen" }
                })
              );
            };

            document.head.appendChild(script);
          },

          grant: function () {
            this.consent = "granted";
            this.writeConsent("granted");
            this.loadProvider();

            window.dispatchEvent(
              new CustomEvent("isabella:consent-updated", {
                detail: { category: "advertising", value: "granted" }
              })
            );
          },

          deny: function () {
            this.consent = "denied";
            this.writeConsent("denied");

            window.dispatchEvent(
              new CustomEvent("isabella:consent-updated", {
                detail: { category: "advertising", value: "denied" }
              })
            );
          },

          track: function (eventName, properties) {
            if (this.consent !== "granted") {
              return;
            }

            this.ensureQueue();

            window.idlen("track", eventName, {
              product: "isabella-ai",
              surface: "chat-sponsored-card",
              ...properties
            });
          },

          restore: function () {
            this.consent = this.readConsent();

            if (this.consent === "granted") {
              this.loadProvider();
            }
          }
        };

        window.isabellaAds = ads;
        ads.restore();
      })(window, document);
    </script>
  </head>
