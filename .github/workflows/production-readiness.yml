name: Production Readiness

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    name: Typecheck, build, audit and secrets baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Quantum bridge fallback diagnose
        run: npm run quantum:diagnose
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Generate SBOM
        run: npm sbom --json > sbom.cdx.json
      - name: Secret scan baseline
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
