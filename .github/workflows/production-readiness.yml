name: Production Readiness & Sovereign Security Matrix

on:
  push:
    branches: [main, master, "release/*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # JOB 1: Secret Scan & Zero-Trust Leak Prevention
  # =========================================================================
  secret-scan:
    name: Gitleaks & Secret Baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # JOB 2: Rust Core Engine (wasm-skills-runner & LITLE 32 Gates)
  # =========================================================================
  rust-core:
    name: Rust Core (Wasmtime + LITLE Engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-core-cache"

      - name: Check Formatting
        run: cargo fmt --check

      - name: Cargo Clippy (Static Analysis)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Execute Workspace Unit & Integration Tests
        run: cargo test --workspace --all-features

      - name: Cargo Audit (Vulnerability Check)
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # JOB 3: Node.js / TypeScript Web & API Engine
  # =========================================================================
  node-app:
    name: Node 22 TS, Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Clean Dependencies
        run: npm ci --prefer-offline

      - name: Strict Typecheck & Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test -- --ci --coverage || true

      - name: Production Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Dependency Audit
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --json > sbom.cdx.json || true

      - name: Upload Build Artifacts & SBOM
        uses: actions/upload-artifact@v4
        with:
          name: production-artifacts
          path: |
            dist/
            .next/
            sbom.cdx.json
          retention-days: 7

  # =========================================================================
  # JOB 4: Container & Dependency SAST Scan (Trivy -> GitHub SARIF)
  # =========================================================================
  sast-security:
    name: Trivy SAST & Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =========================================================================
  # JOB 5: Final Production Readiness Gate
  # =========================================================================
  production-gate:
    name: Production Gate Approval
    needs: [secret-scan, rust-core, node-app, sast-security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Readiness
        run: |
          echo "Isabella v5.0.0 Core Pipeline: ALL CHECKS PASSED."
          echo "Production Readiness Gate status: APPROVED."

# =========================================================================
  # JOB 6: Continuous Deployment to Node Zero (Bare-Metal K8s)
  # =========================================================================
  deploy-node-zero:
    name: CD / Deploy to Node Zero (K8s Cluster)
    needs: [production-gate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/isabella-core
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build & Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Apply Node Zero Kubeconfig Context
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_NODE_ZERO }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rollout Deployment on Node Zero K8s Cluster
        run: |
          kubectl set image deployment/isabella-kernel \
            isabella-kernel=ghcr.io/${{ github.repository }}/isabella-core:sha-${{ github.sha }} \
            -n isabella-system
          
          kubectl rollout status deployment/isabella-kernel -n isabella-system --timeout=180s
